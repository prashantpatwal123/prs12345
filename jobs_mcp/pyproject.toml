[project]
name = "jobs-mcp"
version = "0.2.0"
description = "MCP server: index jobs from company career sections worldwide, find contacts, check candidate fitment"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "httpx>=0.27", "beautifulsoup4>=4.12", "pyyaml>=6", "pydantic>=2", "duckdb>=1.1"]

[project.scripts]
jobs-mcp = "jobs_mcp.server:main"
jobs-pipeline = "pipeline.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobs_mcp", "pipeline"]
